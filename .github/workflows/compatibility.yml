name: Plugin compatibility
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-codex.js --check
      - run: node scripts/check-supply-chain.js
      - run: node --test tests/compatibility.test.js tests/conformance.test.js tests/catalog.test.js tests/baseline.test.js tests/guards.test.js tests/memory.test.js tests/review.test.js tests/scope.test.js tests/metrics.test.js tests/install.test.js tests/adopt.test.js tests/sec-scan.test.js tests/usage.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/release-test.py
      - run: node scripts/package-plugin.js work/package/crew
