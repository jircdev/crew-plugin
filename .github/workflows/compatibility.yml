name: Plugin compatibility
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-codex.js --check
      - run: node --test "tests/*.test.js"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/release-test.py
      - run: node scripts/package-plugin.js work/package/crew
